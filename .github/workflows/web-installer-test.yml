name: Web Installer Testing

on:
  workflow_dispatch:

jobs:
  InstallationTest:
    runs-on: ${{ matrix.os }}
    # The action installs Moodle against localhost:5432 using the credentials below, so the database
    # has to be provided here. Without it the installer stops at the database step.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: [8.3, 8.4]
    steps:
      - name: Construct repository URL
        run: echo "REPOSITORY_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" >> $GITHUB_ENV
        shell: bash

      - uses: moodlehq/moodle-webinstaller-test@main
        with:
          repository: ${{ env.REPOSITORY_URL }}
          branch: ${{ github.ref_name }}
          php: ${{ matrix.php }}
